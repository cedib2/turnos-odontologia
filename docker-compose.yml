# Base de datos para desarrollo local. Credenciales solo de desarrollo: no usar en producción.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: turnos-odontologia-db
    environment:
      POSTGRES_DB: turnos
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
