# Cada contexto de test cacheado conserva su pool Hikari: se acota para no agotar
# max_connections de Postgres (100) con varios contextos vivos a la vez.
# Ver docs/decisiones/C-13-patient-clinical-record-access.md.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
