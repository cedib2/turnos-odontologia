spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    clean-disabled: false
    out-of-order: true
    locations: classpath:db/migration

public:
  token:
    issuer: turnos-odontologia-public
  surface:
    prefixes: /publico/v1
