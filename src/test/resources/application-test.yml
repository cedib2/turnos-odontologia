spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    clean-disabled: false
    out-of-order: true
    locations: classpath:db/migration

public:
  token:
    issuer: turnos-odontologia-public
  surface:
    prefixes: /publico/v1

APP_BASE_URL: http://localhost:9999
MERCADOPAGO_ACCESS_TOKEN: test-access-token
MERCADOPAGO_WEBHOOK_SECRET: test-webhook-secret-c15
