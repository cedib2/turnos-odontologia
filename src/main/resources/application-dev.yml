spring:
  flyway:
    out-of-order: true

public:
  token:
    issuer: turnos-odontologia-public
  surface:
    prefixes: /publico/v1

# Defaults no productivos para desarrollo; los valores reales se inyectan por entorno.
ARCA_BASE_URL: http://localhost:9999/arca
ARCA_ACCESS_TOKEN: arca-token-de-prueba-no-real

arca:
  comprobante:
    letra: C
    punto-venta: "0001"

# Defaults no productivos de C-19; los valores reales se definen en el piloto.
waitlist:
  oferta:
    minutos: 15
  metricas:
    periodo: YYYY-MM
  deposito:
    monto: 1.00
