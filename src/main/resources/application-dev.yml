spring:
  flyway:
    out-of-order: true
    # Datos de prueba solo en dev (ver docs/datos-de-prueba.md). Test y producción no los cargan.
    locations: classpath:db/migration,classpath:db/datos-prueba

public:
  token:
    issuer: turnos-odontologia-public
  surface:
    prefixes: /publico/v1

# Defaults no productivos para desarrollo; los valores reales se inyectan por entorno.
ARCA_BASE_URL: http://localhost:9999/arca
ARCA_ACCESS_TOKEN: arca-token-de-prueba-no-real

arca:
  comprobante:
    letra: C
    punto-venta: "0001"

# Defaults no productivos de C-19; los valores reales se definen en el piloto.
waitlist:
  oferta:
    minutos: 15
  metricas:
    periodo: YYYY-MM
  deposito:
    monto: 1.00

# C-10: circuito completo de WhatsApp en dev con el gateway SIMULADO (no se envía nada real).
# La anticipación del recordatorio sigue (TBD): 24 h es un default no productivo de dev.
notificaciones:
  turnos:
    whatsapp: true
  dispatcher:
    habilitado: true
    intervalo-ms: 30000
  recordatorio:
    anticipacion-horas: 24
